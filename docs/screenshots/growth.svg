<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 720" font-family="Inter, Segoe UI, system-ui, sans-serif">
  <rect width="360" height="720" rx="28" fill="#fff5f7"/>

  <rect width="360" height="24" fill="#fff5f7"/>
  <text x="16" y="17" fill="#ff3d72" font-size="11" font-weight="700">9:41</text>

  <g transform="translate(16 40)">
    <text fill="#0F172A" font-size="20" font-weight="800">Growth</text>
    <text y="20" fill="#94A3B8" font-size="11">Track weight &amp; height over time</text>
  </g>

  <!-- KPI cards -->
  <g transform="translate(16 96)">
    <rect width="156" height="86" rx="18" fill="#ffffff" stroke="#ffe0e8"/>
    <g transform="translate(14 14)">
      <circle r="14" cx="14" cy="14" fill="#ffe0e8"/>
      <text x="14" y="20" text-anchor="middle" font-size="14">⚖️</text>
    </g>
    <text x="14" y="58" fill="#0F172A" font-size="20" font-weight="800">5.4 kg</text>
    <text x="14" y="76" fill="#16a34a" font-size="9" font-weight="700">▲ 0.3 kg this week</text>
  </g>
  <g transform="translate(188 96)">
    <rect width="156" height="86" rx="18" fill="#ffffff" stroke="#ffe0e8"/>
    <g transform="translate(14 14)">
      <circle r="14" cx="14" cy="14" fill="#ffe0e8"/>
      <text x="14" y="20" text-anchor="middle" font-size="14">📏</text>
    </g>
    <text x="14" y="58" fill="#0F172A" font-size="20" font-weight="800">58.2 cm</text>
    <text x="14" y="76" fill="#16a34a" font-size="9" font-weight="700">▲ 1.4 cm this month</text>
  </g>

  <!-- weight chart -->
  <g transform="translate(16 200)">
    <rect width="328" height="200" rx="18" fill="#ffffff" stroke="#ffe0e8"/>
    <text x="16" y="26" fill="#0F172A" font-size="12" font-weight="800">Weight curve</text>
    <text x="16" y="42" fill="#94A3B8" font-size="10">Last 12 weeks · WHO 50th percentile</text>

    <g transform="translate(30 60)">
      <!-- gridlines -->
      <g stroke="#fff5f7" stroke-width="1">
        <line x1="0" y1="0" x2="284" y2="0"/>
        <line x1="0" y1="30" x2="284" y2="30"/>
        <line x1="0" y1="60" x2="284" y2="60"/>
        <line x1="0" y1="90" x2="284" y2="90"/>
        <line x1="0" y1="120" x2="284" y2="120"/>
      </g>
      <g fill="#94A3B8" font-size="8" text-anchor="end">
        <text x="-4" y="3">6.0</text>
        <text x="-4" y="33">5.5</text>
        <text x="-4" y="63">5.0</text>
        <text x="-4" y="93">4.5</text>
        <text x="-4" y="123">4.0</text>
      </g>
      <!-- WHO 50th reference -->
      <path d="M0 100 Q60 80 120 60 T280 18" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
      <text x="240" y="14" fill="#94A3B8" font-size="8" font-style="italic">WHO 50th</text>
      <!-- area -->
      <path d="M0 110 Q40 96 80 84 T160 50 T280 12 L280 130 L0 130 Z" fill="url(#fade)" opacity="0.25"/>
      <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#ff3d72"/>
        <stop offset="100%" stop-color="#ff3d72" stop-opacity="0"/>
      </linearGradient>
      <!-- actual line -->
      <path d="M0 110 Q40 96 80 84 T160 50 T280 12" fill="none" stroke="#ff3d72" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- points -->
      <g fill="#ff3d72">
        <circle cx="0"   cy="110" r="4"/>
        <circle cx="60"  cy="92"  r="4"/>
        <circle cx="120" cy="62"  r="4"/>
        <circle cx="180" cy="42"  r="4"/>
        <circle cx="240" cy="22"  r="4"/>
        <circle cx="280" cy="12"  r="5" stroke="#ffffff" stroke-width="2"/>
      </g>
      <!-- highlight tooltip -->
      <g transform="translate(232 -10)">
        <rect width="58" height="22" rx="6" fill="#0F172A"/>
        <text x="29" y="14" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="700">5.4 kg · W12</text>
      </g>
      <g fill="#94A3B8" font-size="8" text-anchor="middle">
        <text x="0"   y="148">W1</text>
        <text x="60"  y="148">W3</text>
        <text x="120" y="148">W6</text>
        <text x="180" y="148">W9</text>
        <text x="240" y="148">W11</text>
        <text x="280" y="148">W12</text>
      </g>
    </g>
  </g>

  <!-- log entry form preview -->
  <g transform="translate(16 418)">
    <rect width="328" height="118" rx="18" fill="#ffffff" stroke="#ffe0e8"/>
    <text x="16" y="26" fill="#0F172A" font-size="12" font-weight="800">Log a new measurement</text>
    <g transform="translate(16 38)">
      <rect width="142" height="36" rx="10" fill="#fff5f7"/>
      <text x="12" y="14" fill="#94A3B8" font-size="9" font-weight="700">WEIGHT (kg)</text>
      <text x="12" y="28" fill="#0F172A" font-size="13" font-weight="700">5.4</text>
    </g>
    <g transform="translate(170 38)">
      <rect width="142" height="36" rx="10" fill="#fff5f7"/>
      <text x="12" y="14" fill="#94A3B8" font-size="9" font-weight="700">HEIGHT (cm)</text>
      <text x="12" y="28" fill="#0F172A" font-size="13" font-weight="700">58.2</text>
    </g>
    <g transform="translate(16 84)">
      <rect width="296" height="20" rx="10" fill="#fff5f7"/>
      <text x="10" y="14" fill="#94A3B8" font-size="9">📅 May 7, 2026 · 10:24</text>
    </g>
  </g>
  <g transform="translate(16 542)">
    <rect width="328" height="44" rx="14" fill="#ff3d72"/>
    <text x="164" y="28" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="800">Save measurement</text>
  </g>

  <!-- recent measurements -->
  <text x="20" y="616" fill="#0F172A" font-size="12" font-weight="800">Recent</text>
  <g transform="translate(16 626)">
    <rect width="328" height="78" rx="16" fill="#ffffff" stroke="#ffe0e8"/>
    <g transform="translate(16 14)" font-size="10">
      <text fill="#0F172A" font-weight="700">May 7</text>
      <text x="80" fill="#ff3d72" font-weight="800">5.4 kg</text>
      <text x="160" fill="#ff3d72" font-weight="800">58.2 cm</text>
      <text x="244" fill="#94A3B8">+0.1 / +0.3</text>
    </g>
    <g transform="translate(16 38)" font-size="10">
      <text fill="#0F172A" font-weight="700">Apr 30</text>
      <text x="80" fill="#ff3d72" font-weight="800">5.3 kg</text>
      <text x="160" fill="#ff3d72" font-weight="800">57.9 cm</text>
      <text x="244" fill="#94A3B8">+0.2 / +0.4</text>
    </g>
    <g transform="translate(16 62)" font-size="10">
      <text fill="#0F172A" font-weight="700">Apr 23</text>
      <text x="80" fill="#ff3d72" font-weight="800">5.1 kg</text>
      <text x="160" fill="#ff3d72" font-weight="800">57.5 cm</text>
      <text x="244" fill="#94A3B8">+0.3 / +0.5</text>
    </g>
  </g>
</svg>
