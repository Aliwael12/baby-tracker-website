<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 720" font-family="Inter, Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff5f7"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff5f7"/>
    </linearGradient>
    <linearGradient id="active" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6b95"/>
      <stop offset="100%" stop-color="#ff3d72"/>
    </linearGradient>
  </defs>
  <rect width="360" height="720" rx="28" fill="url(#bg)"/>

  <!-- status bar -->
  <rect width="360" height="24" fill="#fff5f7"/>
  <text x="16" y="17" fill="#ff3d72" font-size="11" font-weight="700">9:41</text>
  <g transform="translate(316 9)" fill="#ff3d72">
    <rect width="14" height="8" rx="1.5"/>
    <rect x="18" y="2" width="20" height="4" rx="1"/>
  </g>

  <!-- header -->
  <g transform="translate(16 40)">
    <text fill="#0F172A" font-size="22" font-weight="800">Baby Tracker</text>
    <text y="22" fill="#94A3B8" font-size="12">Hi, <tspan fill="#ff3d72" font-weight="700" text-decoration="underline">Mama</tspan></text>
    <g transform="translate(244 0)">
      <rect width="36" height="36" rx="11" fill="#ffffff"/>
      <path d="M11 12 h14 M11 18 h14 M11 24 h14" stroke="#ff3d72" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g transform="translate(288 0)">
      <rect width="36" height="36" rx="11" fill="#ffffff"/>
      <path d="M18 12 v12 M12 18 h12" stroke="#ff3d72" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- last feed banner -->
  <g transform="translate(16 100)">
    <rect width="328" height="56" rx="16" fill="#ffe0e8"/>
    <text x="16" y="22" fill="#e02060" font-size="10" font-weight="700">LAST FEED</text>
    <text x="16" y="42" fill="#0F172A" font-size="13" font-weight="700">2h 14m ago · Right side · 18 min</text>
    <g transform="translate(280 12)">
      <circle r="16" cx="16" cy="16" fill="#ffffff"/>
      <text x="16" y="22" text-anchor="middle" font-size="16">🤱</text>
    </g>
  </g>

  <!-- Feed card (active timer) -->
  <g transform="translate(16 172)">
    <rect width="328" height="92" rx="20" fill="url(#active)"/>
    <g transform="translate(18 18)">
      <circle r="18" cx="18" cy="18" fill="#ffffff"/>
      <text x="18" y="24" text-anchor="middle" font-size="18">🤱</text>
    </g>
    <text x="72" y="38" fill="#ffffff" font-size="14" font-weight="800">Feed</text>
    <text x="72" y="54" fill="#ffe0e8" font-size="11">Right side · running</text>
    <text x="244" y="44" fill="#ffffff" font-size="22" font-weight="800" font-family="ui-monospace, Menlo, monospace">12:38</text>
    <!-- pause/stop -->
    <g transform="translate(18 64)">
      <rect width="60" height="20" rx="10" fill="#ffffff" fill-opacity="0.25"/>
      <rect x="22" y="6" width="3" height="8" fill="#ffffff"/>
      <rect x="29" y="6" width="3" height="8" fill="#ffffff"/>
      <text x="40" y="14" fill="#ffffff" font-size="9" font-weight="700">PAUSE</text>
    </g>
    <g transform="translate(84 64)">
      <rect width="60" height="20" rx="10" fill="#ffffff"/>
      <rect x="20" y="5" width="10" height="10" rx="1" fill="#ff3d72"/>
      <text x="42" y="14" fill="#ff3d72" font-size="9" font-weight="800">STOP</text>
    </g>
    <!-- L/R toggle -->
    <g transform="translate(244 60)">
      <rect width="64" height="24" rx="12" fill="#ffffff" fill-opacity="0.25"/>
      <rect x="32" y="0" width="32" height="24" rx="12" fill="#ffffff"/>
      <text x="16" y="16" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">L</text>
      <text x="48" y="16" text-anchor="middle" fill="#ff3d72" font-size="10" font-weight="800">R</text>
    </g>
  </g>

  <!-- Pump -->
  <g transform="translate(16 280)">
    <rect width="328" height="64" rx="16" fill="#ffffff" stroke="#ffe0e8"/>
    <g transform="translate(14 14)">
      <circle r="18" cx="18" cy="18" fill="#fff5f7"/>
      <text x="18" y="24" text-anchor="middle" font-size="18">🍼</text>
    </g>
    <text x="68" y="32" fill="#0F172A" font-size="13" font-weight="700">Pump</text>
    <text x="68" y="48" fill="#94A3B8" font-size="10">Tap to log · choose side</text>
    <g transform="translate(244 18)">
      <rect width="68" height="28" rx="14" fill="#ffe0e8"/>
      <text x="34" y="18" text-anchor="middle" fill="#e02060" font-size="11" font-weight="800">+ LOG</text>
    </g>
  </g>

  <!-- Sleep -->
  <g transform="translate(16 360)">
    <rect width="328" height="64" rx="16" fill="#ffffff" stroke="#ffe0e8"/>
    <g transform="translate(14 14)">
      <circle r="18" cx="18" cy="18" fill="#fff5f7"/>
      <text x="18" y="24" text-anchor="middle" font-size="18">😴</text>
    </g>
    <text x="68" y="32" fill="#0F172A" font-size="13" font-weight="700">Sleep</text>
    <text x="68" y="48" fill="#94A3B8" font-size="10">Last nap: 1h 12m · 35 min ago</text>
    <g transform="translate(244 18)">
      <rect width="68" height="28" rx="14" fill="#ff3d72"/>
      <path d="M260 26 l8 6 l-8 6 z" fill="#ffffff"/>
      <text x="290" y="36" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="800">START</text>
    </g>
  </g>

  <!-- Diaper -->
  <g transform="translate(16 440)">
    <rect width="328" height="64" rx="16" fill="#ffffff" stroke="#ffe0e8"/>
    <g transform="translate(14 14)">
      <circle r="18" cx="18" cy="18" fill="#fff5f7"/>
      <text x="18" y="24" text-anchor="middle" font-size="18">🩲</text>
    </g>
    <text x="68" y="32" fill="#0F172A" font-size="13" font-weight="700">Diaper</text>
    <text x="68" y="48" fill="#94A3B8" font-size="10">Today: 5 changes · last 1h ago</text>
    <g transform="translate(220 18)">
      <rect width="42" height="28" rx="14" fill="#fff5f7"/>
      <text x="21" y="18" text-anchor="middle" fill="#e02060" font-size="11" font-weight="800">💧</text>
    </g>
    <g transform="translate(266 18)">
      <rect width="42" height="28" rx="14" fill="#fff5f7"/>
      <text x="21" y="18" text-anchor="middle" font-size="11">💩</text>
    </g>
  </g>

  <!-- Shower -->
  <g transform="translate(16 520)">
    <rect width="328" height="64" rx="16" fill="#ffffff" stroke="#ffe0e8"/>
    <g transform="translate(14 14)">
      <circle r="18" cx="18" cy="18" fill="#fff5f7"/>
      <text x="18" y="24" text-anchor="middle" font-size="18">🚿</text>
    </g>
    <text x="68" y="32" fill="#0F172A" font-size="13" font-weight="700">Shower</text>
    <text x="68" y="48" fill="#94A3B8" font-size="10">Last: yesterday 19:30</text>
    <g transform="translate(244 18)">
      <rect width="68" height="28" rx="14" fill="#ffe0e8"/>
      <text x="34" y="18" text-anchor="middle" fill="#e02060" font-size="11" font-weight="800">+ LOG</text>
    </g>
  </g>

  <!-- daily stats -->
  <g transform="translate(16 600)">
    <rect width="328" height="92" rx="18" fill="#ffffff" stroke="#ffe0e8"/>
    <text x="16" y="24" fill="#0F172A" font-size="12" font-weight="800">Today</text>
    <g transform="translate(16 36)" font-size="9">
      <g><text fill="#94A3B8">Feeds</text><text y="18" fill="#0F172A" font-size="16" font-weight="800">7</text><text y="32" fill="#ff3d72" font-weight="700">2h 04m</text></g>
      <g transform="translate(82 0)"><text fill="#94A3B8">Pumps</text><text y="18" fill="#0F172A" font-size="16" font-weight="800">3</text><text y="32" fill="#ff3d72" font-weight="700">240 ml</text></g>
      <g transform="translate(164 0)"><text fill="#94A3B8">Sleep</text><text y="18" fill="#0F172A" font-size="16" font-weight="800">14h</text><text y="32" fill="#ff3d72" font-weight="700">5 naps</text></g>
      <g transform="translate(232 0)"><text fill="#94A3B8">Diapers</text><text y="18" fill="#0F172A" font-size="16" font-weight="800">9</text><text y="32" fill="#ff3d72" font-weight="700">on track</text></g>
    </g>
  </g>
</svg>
