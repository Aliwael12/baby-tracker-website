<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 720" font-family="Inter, Segoe UI, system-ui, sans-serif">
  <rect width="360" height="720" rx="28" fill="#fff5f7"/>

  <rect width="360" height="24" fill="#fff5f7"/>
  <text x="16" y="17" fill="#ff3d72" font-size="11" font-weight="700">9:41</text>

  <g transform="translate(16 40)">
    <text fill="#0F172A" font-size="20" font-weight="800">Analytics</text>
    <text y="20" fill="#94A3B8" font-size="11">Last 7 days · 42 entries</text>
  </g>

  <!-- range tabs -->
  <g transform="translate(16 96)" font-size="10" font-weight="700">
    <g><rect width="56" height="28" rx="14" fill="#ffffff" stroke="#ffe0e8"/><text x="28" y="18" text-anchor="middle" fill="#0F172A">Day</text></g>
    <g transform="translate(64 0)"><rect width="62" height="28" rx="14" fill="#ff3d72"/><text x="31" y="18" text-anchor="middle" fill="#ffffff">Week</text></g>
    <g transform="translate(134 0)"><rect width="68" height="28" rx="14" fill="#ffffff" stroke="#ffe0e8"/><text x="34" y="18" text-anchor="middle" fill="#0F172A">Month</text></g>
  </g>

  <!-- summary cards -->
  <g transform="translate(16 142)">
    <rect width="156" height="76" rx="18" fill="#ffffff" stroke="#ffe0e8"/>
    <text x="14" y="24" fill="#94A3B8" font-size="9" font-weight="800" letter-spacing="1">FEED TIME · WEEK</text>
    <text x="14" y="48" fill="#ff3d72" font-size="22" font-weight="800">14h 32m</text>
    <text x="14" y="66" fill="#16a34a" font-size="9" font-weight="700">▲ 8% vs last week</text>
  </g>
  <g transform="translate(188 142)">
    <rect width="156" height="76" rx="18" fill="#ffffff" stroke="#ffe0e8"/>
    <text x="14" y="24" fill="#94A3B8" font-size="9" font-weight="800" letter-spacing="1">SLEEP · AVG/DAY</text>
    <text x="14" y="48" fill="#ff3d72" font-size="22" font-weight="800">14h 06m</text>
    <text x="14" y="66" fill="#dc2626" font-size="9" font-weight="700">▼ 12m vs last week</text>
  </g>

  <!-- bar chart -->
  <g transform="translate(16 234)">
    <rect width="328" height="180" rx="18" fill="#ffffff" stroke="#ffe0e8"/>
    <text x="16" y="26" fill="#0F172A" font-size="12" font-weight="800">Feeds per day</text>
    <g transform="translate(16 50)" font-size="9">
      <g fill="#cbd5e1" stroke-dasharray="3 3" stroke="#cbd5e1">
        <line x1="0" y1="0" x2="296" y2="0"/>
        <line x1="0" y1="30" x2="296" y2="30"/>
        <line x1="0" y1="60" x2="296" y2="60"/>
        <line x1="0" y1="90" x2="296" y2="90"/>
      </g>
      <g fill="#94A3B8" text-anchor="end">
        <text x="-4" y="3">10</text>
        <text x="-4" y="33">7</text>
        <text x="-4" y="63">4</text>
        <text x="-4" y="93">1</text>
      </g>
      <g>
        <rect x="14"  y="34" width="28" height="56" rx="4" fill="#ffc2d4"/>
        <rect x="56"  y="22" width="28" height="68" rx="4" fill="#ff99b8"/>
        <rect x="98"  y="42" width="28" height="48" rx="4" fill="#ffc2d4"/>
        <rect x="140" y="14" width="28" height="76" rx="4" fill="#ff6b95"/>
        <rect x="182" y="28" width="28" height="62" rx="4" fill="#ff99b8"/>
        <rect x="224" y="6"  width="28" height="84" rx="4" fill="#ff3d72"/>
        <rect x="266" y="18" width="28" height="72" rx="4" fill="#ff6b95"/>
      </g>
      <g fill="#94A3B8" text-anchor="middle">
        <text x="28"  y="106">Mon</text>
        <text x="70"  y="106">Tue</text>
        <text x="112" y="106">Wed</text>
        <text x="154" y="106">Thu</text>
        <text x="196" y="106">Fri</text>
        <text x="238" y="106">Sat</text>
        <text x="280" y="106">Sun</text>
      </g>
    </g>
  </g>

  <!-- ring/donut: activity split -->
  <g transform="translate(16 432)">
    <rect width="328" height="174" rx="18" fill="#ffffff" stroke="#ffe0e8"/>
    <text x="16" y="26" fill="#0F172A" font-size="12" font-weight="800">Activity split</text>

    <g transform="translate(74 92)">
      <circle r="48" fill="none" stroke="#fff5f7" stroke-width="14"/>
      <!-- segments via dasharray on circle r=48, circumference≈301.6 -->
      <circle r="48" fill="none" stroke="#ff3d72" stroke-width="14" stroke-dasharray="120 301" transform="rotate(-90)"/>
      <circle r="48" fill="none" stroke="#ff6b95" stroke-width="14" stroke-dasharray="60 301" stroke-dashoffset="-120" transform="rotate(-90)"/>
      <circle r="48" fill="none" stroke="#ff99b8" stroke-width="14" stroke-dasharray="50 301" stroke-dashoffset="-180" transform="rotate(-90)"/>
      <circle r="48" fill="none" stroke="#ffc2d4" stroke-width="14" stroke-dasharray="40 301" stroke-dashoffset="-230" transform="rotate(-90)"/>
      <circle r="48" fill="none" stroke="#ffe0e8" stroke-width="14" stroke-dasharray="31 301" stroke-dashoffset="-270" transform="rotate(-90)"/>
      <text y="-2" text-anchor="middle" fill="#0F172A" font-size="20" font-weight="800">42</text>
      <text y="14" text-anchor="middle" fill="#94A3B8" font-size="9">logs</text>
    </g>

    <g transform="translate(170 50)" font-size="10">
      <g><rect width="10" height="10" rx="3" fill="#ff3d72"/><text x="18" y="9" fill="#0F172A" font-weight="700">Feed</text><text x="138" y="9" text-anchor="end" fill="#94A3B8">40%</text></g>
      <g transform="translate(0 22)"><rect width="10" height="10" rx="3" fill="#ff6b95"/><text x="18" y="9" fill="#0F172A" font-weight="700">Sleep</text><text x="138" y="9" text-anchor="end" fill="#94A3B8">20%</text></g>
      <g transform="translate(0 44)"><rect width="10" height="10" rx="3" fill="#ff99b8"/><text x="18" y="9" fill="#0F172A" font-weight="700">Diaper</text><text x="138" y="9" text-anchor="end" fill="#94A3B8">17%</text></g>
      <g transform="translate(0 66)"><rect width="10" height="10" rx="3" fill="#ffc2d4"/><text x="18" y="9" fill="#0F172A" font-weight="700">Pump</text><text x="138" y="9" text-anchor="end" fill="#94A3B8">13%</text></g>
      <g transform="translate(0 88)"><rect width="10" height="10" rx="3" fill="#ffe0e8"/><text x="18" y="9" fill="#0F172A" font-weight="700">Shower</text><text x="138" y="9" text-anchor="end" fill="#94A3B8">10%</text></g>
    </g>
  </g>

  <!-- insight -->
  <g transform="translate(16 624)">
    <rect width="328" height="80" rx="18" fill="#ff3d72"/>
    <text x="16" y="26" fill="#ffe0e8" font-size="9" font-weight="800" letter-spacing="1">INSIGHT</text>
    <text x="16" y="48" fill="#ffffff" font-size="13" font-weight="700">Feeds peak around 18:00</text>
    <text x="16" y="66" fill="#ffe0e8" font-size="10">Plan a longer pump session in the afternoon.</text>
  </g>
</svg>
