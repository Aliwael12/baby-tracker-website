  <!-- legend -->
  <g transform="translate(16 348)" font-size="9" font-weight="700">
    <g><circle r="4" cx="6" cy="6" fill="#ff3d72"/><text x="16" y="10" fill="#0F172A">Feed</text></g>
    <g transform="translate(54 0)"><circle r="4" cx="6" cy="6" fill="#ff6b95"/><text x="16" y="10" fill="#0F172A">Sleep</text></g>
    <g transform="translate(110 0)"><circle r="4" cx="6" cy="6" fill="#ff99b8"/><text x="16" y="10" fill="#0F172A">Diaper</text></g>
    <g transform="translate(170 0)"><circle r="4" cx="6" cy="6" fill="#ffc2d4"/><text x="16" y="10" fill="#0F172A">Pump</text></g>
    <g transform="translate(220 0)"><circle r="4" cx="6" cy="6" fill="#ffe0e8"/><text x="16" y="10" fill="#0F172A">Shower</text></g>
