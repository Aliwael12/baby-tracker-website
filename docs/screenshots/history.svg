<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 720" font-family="Inter, Segoe UI, system-ui, sans-serif">
  <rect width="360" height="720" rx="28" fill="#fff5f7"/>

  <rect width="360" height="24" fill="#fff5f7"/>
  <text x="16" y="17" fill="#ff3d72" font-size="11" font-weight="700">9:41</text>

  <g transform="translate(16 40)">
    <text fill="#0F172A" font-size="20" font-weight="800">History</text>
    <text y="20" fill="#94A3B8" font-size="11">Browse past days at a glance</text>
  </g>

  <!-- month switcher -->
  <g transform="translate(16 92)">
    <rect width="328" height="44" rx="16" fill="#ffffff" stroke="#ffe0e8"/>
    <g transform="translate(14 14)">
      <path d="M10 8 l-6 6 l6 6" stroke="#ff3d72" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>
    <text x="164" y="28" text-anchor="middle" fill="#0F172A" font-size="14" font-weight="800">May 2026</text>
    <g transform="translate(296 14)">
      <path d="M0 8 l6 6 l-6 6" stroke="#ff3d72" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>
  </g>

  <!-- weekday header -->
  <g transform="translate(16 152)" font-size="9" font-weight="700" fill="#94A3B8" text-anchor="middle">
    <text x="22">S</text><text x="68">M</text><text x="114">T</text><text x="160">W</text><text x="206">T</text><text x="252">F</text><text x="298">S</text>
  </g>

  <!-- calendar grid 6 rows × 7 cols, 44px wide cells -->
  <g transform="translate(16 162)">
    <!-- helper-like inline. cells: w=44,h=52 -->
    <!-- row 1: Apr 26..May 2 -->
    <g font-size="11">
      <g transform="translate(0 0)"><rect width="44" height="52" rx="10" fill="#ffffff"/><text x="22" y="20" text-anchor="middle" fill="#cbd5e1" font-weight="700">26</text></g>
      <g transform="translate(46 0)"><rect width="44" height="52" rx="10" fill="#ffffff"/><text x="22" y="20" text-anchor="middle" fill="#cbd5e1" font-weight="700">27</text></g>
      <g transform="translate(92 0)"><rect width="44" height="52" rx="10" fill="#ffffff"/><text x="22" y="20" text-anchor="middle" fill="#cbd5e1" font-weight="700">28</text></g>
      <g transform="translate(138 0)"><rect width="44" height="52" rx="10" fill="#ffffff"/><text x="22" y="20" text-anchor="middle" fill="#cbd5e1" font-weight="700">29</text></g>
      <g transform="translate(184 0)"><rect width="44" height="52" rx="10" fill="#ffffff"/><text x="22" y="20" text-anchor="middle" fill="#cbd5e1" font-weight="700">30</text></g>
      <g transform="translate(230 0)"><rect width="44" height="52" rx="10" fill="#fff5f7" stroke="#ffe0e8"/><text x="22" y="20" text-anchor="middle" fill="#0F172A" font-weight="700">1</text>
        <g transform="translate(8 28)"><circle cx="3" r="3" fill="#ff3d72"/><circle cx="13" r="3" fill="#ff99b8"/><circle cx="23" r="3" fill="#ffc2d4"/></g>
      </g>
      <g transform="translate(276 0)"><rect width="44" height="52" rx="10" fill="#fff5f7" stroke="#ffe0e8"/><text x="22" y="20" text-anchor="middle" fill="#0F172A" font-weight="700">2</text>
        <g transform="translate(8 28)"><circle cx="3" r="3" fill="#ff3d72"/><circle cx="13" r="3" fill="#ff6b95"/></g>
      </g>
    </g>
    <!-- row 2: May 3..9 -->
    <g transform="translate(0 56)" font-size="11">
      <g transform="translate(0 0)"><rect width="44" height="52" rx="10" fill="#fff5f7" stroke="#ffe0e8"/><text x="22" y="20" text-anchor="middle" fill="#0F172A" font-weight="700">3</text>
        <g transform="translate(8 28)"><circle cx="3" r="3" fill="#ff3d72"/><circle cx="13" r="3" fill="#ff99b8"/><circle cx="23" r="3" fill="#ffc2d4"/><circle cx="33" r="3" fill="#ffe0e8"/></g>
      </g>
      <g transform="translate(46 0)"><rect width="44" height="52" rx="10" fill="#fff5f7" stroke="#ffe0e8"/><text x="22" y="20" text-anchor="middle" fill="#0F172A" font-weight="700">4</text>
        <g transform="translate(8 28)"><circle cx="3" r="3" fill="#ff3d72"/><circle cx="13" r="3" fill="#ff6b95"/><circle cx="23" r="3" fill="#ff99b8"/></g>
      </g>
      <g transform="translate(92 0)"><rect width="44" height="52" rx="10" fill="#fff5f7" stroke="#ffe0e8"/><text x="22" y="20" text-anchor="middle" fill="#0F172A" font-weight="700">5</text>
        <g transform="translate(8 28)"><circle cx="3" r="3" fill="#ff3d72"/><circle cx="13" r="3" fill="#ffc2d4"/></g>
