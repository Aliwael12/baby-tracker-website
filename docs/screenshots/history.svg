  <g transform="translate(16 376)">
    <rect width="328" height="142" rx="18" fill="#ffffff" stroke="#ffe0e8"/>
    <text x="16" y="26" fill="#94A3B8" font-size="10" font-weight="800" letter-spacing="1">SELECTED · MAY 7</text>
    <text x="16" y="48" fill="#0F172A" font-size="16" font-weight="800">12 logs · 14h 04m sleep</text>

    <g transform="translate(16 60)" font-size="10">
      <g><circle cx="6" cy="6" r="4" fill="#ff3d72"/><text x="16" y="10" fill="#0F172A" font-weight="700">7 feeds · 2h 04m</text></g>
      <g transform="translate(0 22)"><circle cx="6" cy="6" r="4" fill="#ff6b95"/><text x="16" y="10" fill="#0F172A" font-weight="700">5 naps · longest 1h 12m</text></g>
      <g transform="translate(0 44)"><circle cx="6" cy="6" r="4" fill="#ff99b8"/><text x="16" y="10" fill="#0F172A" font-weight="700">9 diapers · 3 soiled</text></g>
      <g transform="translate(0 66)"><circle cx="6" cy="6" r="4" fill="#ffc2d4"/><text x="16" y="10" fill="#0F172A" font-weight="700">3 pumps · 240 ml total</text></g>
    </g>

    <g transform="translate(220 76)">
