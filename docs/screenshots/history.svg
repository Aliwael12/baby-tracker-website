    <g transform="translate(0 112)" font-size="11">
      <g transform="translate(0 0)"><rect width="44" height="52" rx="10" fill="#ffffff"/><text x="22" y="20" text-anchor="middle" fill="#94A3B8" font-weight="700">10</text></g>
      <g transform="translate(46 0)"><rect width="44" height="52" rx="10" fill="#ffffff"/><text x="22" y="20" text-anchor="middle" fill="#94A3B8" font-weight="700">11</text></g>
      <g transform="translate(92 0)"><rect width="44" height="52" rx="10" fill="#ffffff"/><text x="22" y="20" text-anchor="middle" fill="#94A3B8" font-weight="700">12</text></g>
      <g transform="translate(138 0)"><rect width="44" height="52" rx="10" fill="#ffffff"/><text x="22" y="20" text-anchor="middle" fill="#94A3B8" font-weight="700">13</text></g>
