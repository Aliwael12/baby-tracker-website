    <text x="16" y="24" fill="#0F172A" font-size="12" font-weight="800">Sleep pattern · this week</text>
    <g transform="translate(16 36)">
      <!-- simple heat-like row of 24 slots × 7 days, here just 1 row demo -->
      <g>
        <rect x="0"   y="0" width="11" height="14" rx="2" fill="#ffe0e8"/>
        <rect x="13"  y="0" width="11" height="14" rx="2" fill="#ffc2d4"/>
        <rect x="26"  y="0" width="11" height="14" rx="2" fill="#ff99b8"/>
        <rect x="39"  y="0" width="11" height="14" rx="2" fill="#ff6b95"/>
        <rect x="52"  y="0" width="11" height="14" rx="2" fill="#ff3d72"/>
        <rect x="65"  y="0" width="11" height="14" rx="2" fill="#ff3d72"/>
        <rect x="78"  y="0" width="11" height="14" rx="2" fill="#ff6b95"/>
        <rect x="91"  y="0" width="11" height="14" rx="2" fill="#ff99b8"/>
        <rect x="104" y="0" width="11" height="14" rx="2" fill="#ffc2d4"/>
        <rect x="117" y="0" width="11" height="14" rx="2" fill="#ffe0e8"/>
        <rect x="130" y="0" width="11" height="14" rx="2" fill="#ffe0e8"/>
        <rect x="143" y="0" width="11" height="14" rx="2" fill="#ffc2d4"/>
        <rect x="156" y="0" width="11" height="14" rx="2" fill="#ff99b8"/>
        <rect x="169" y="0" width="11" height="14" rx="2" fill="#ff6b95"/>
        <rect x="182" y="0" width="11" height="14" rx="2" fill="#ff3d72"/>
        <rect x="195" y="0" width="11" height="14" rx="2" fill="#ff6b95"/>
        <rect x="208" y="0" width="11" height="14" rx="2" fill="#ff99b8"/>
        <rect x="221" y="0" width="11" height="14" rx="2" fill="#ffc2d4"/>
        <rect x="234" y="0" width="11" height="14" rx="2" fill="#ffe0e8"/>
        <rect x="247" y="0" width="11" height="14" rx="2" fill="#ffe0e8"/>
        <rect x="260" y="0" width="11" height="14" rx="2" fill="#ffe0e8"/>
        <rect x="273" y="0" width="11" height="14" rx="2" fill="#ffc2d4"/>
        <rect x="286" y="0" width="11" height="14" rx="2" fill="#ff99b8"/>
        <rect x="299" y="0" width="11" height="14" rx="2" fill="#ff6b95"/>
      </g>
      <g fill="#94A3B8" font-size="8">
        <text x="0" y="30">12a</text>
        <text x="78" y="30">6a</text>
        <text x="156" y="30">12p</text>
        <text x="234" y="30">6p</text>
        <text x="290" y="30">11p</text>
