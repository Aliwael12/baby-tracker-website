      <g transform="translate(184 0)"><rect width="44" height="52" rx="10" fill="#ff3d72"/><text x="22" y="20" text-anchor="middle" fill="#ffffff" font-weight="800">7</text>
        <g transform="translate(8 28)"><circle cx="3" r="3" fill="#ffffff"/><circle cx="13" r="3" fill="#ffffff" opacity="0.85"/><circle cx="23" r="3" fill="#ffffff" opacity="0.7"/><circle cx="33" r="3" fill="#ffffff" opacity="0.5"/></g>
      </g>
      <g transform="translate(230 0)"><rect width="44" height="52" rx="10" fill="#ffffff"/><text x="22" y="20" text-anchor="middle" fill="#94A3B8" font-weight="700">8</text></g>
      <g transform="translate(276 0)"><rect width="44" height="52" rx="10" fill="#ffffff"/><text x="22" y="20" text-anchor="middle" fill="#94A3B8" font-weight="700">9</text></g>
